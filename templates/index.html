{% extends "base.html" %}
{% block title %}仪表盘 - 消息记录器{% endblock %}
{% set active_page = 'dashboard' %}

{% block extra_css %}
<style>
  .chart-box {
    width: 100%;
    height: 280px;
  }
</style>
{% endblock %}

{% block content %}
<!-- 统计卡片 -->
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-value" id="totalCount">-</div>
    <div class="stat-label">总消息数</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="groupCount">-</div>
    <div class="stat-label">群聊消息</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="privateCount">-</div>
    <div class="stat-label">私聊消息</div>
  </div>
  <div class="stat-card">
    <div class="stat-value" id="platformCount">-</div>
    <div class="stat-label">平台数</div>
  </div>
</div>

<!-- 时间范围选择器 -->
<div class="card">
  <div class="card-header">时间范围</div>
  <div class="time-selector">
    <button class="time-btn" data-range="today">今日</button>
    <button class="time-btn" data-range="yesterday">昨日</button>
    <button class="time-btn" data-range="last7d">最近7天</button>
    <button class="time-btn active" data-range="last30d">最近30天</button>
    <button class="time-btn" data-range="week">本周</button>
    <button class="time-btn" data-range="month">本月</button>
  </div>
  <p class="text-muted" id="timeRangeInfo">-</p>
</div>

<!-- 图表区域 -->
<div class="charts-grid">
  <div class="chart-container">
    <div class="chart-title">消息时间趋势</div>
    <div class="chart-box" id="timelineChart"></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">平台分布</div>
    <div class="chart-box" id="platformChart"></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">热门发送者排行</div>
    <div class="chart-box" id="senderChart"></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">活跃群组排行</div>
    <div class="chart-box" id="groupChart"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="/message_recorder/static/js/dashboard.js"></script>
{% endblock %}

{% extends "base.html" %}
{% block title %}导入 - 消息记录器{% endblock %}
{% set active_page = 'import' %}

{% block content %}
<div id="importPage">
  <!-- 文件上传 -->
  <div class="card">
    <div class="card-header">选择文件</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <p>拖拽文件到这里，或点击选择文件</p>
      <p class="text-muted">支持 JSON、CSV 格式</p>
      <input type="file" id="importFile" accept=".json,.csv" style="display: none;">
    </div>
    <div id="fileInfo" style="display: none; margin-top: 1rem;"></div>
  </div>

  <!-- 导入模式 -->
  <div class="card">
    <div class="card-header">导入模式</div>
    <div class="filter-row">
      <label style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="radio" name="importMode" value="merge" checked>
        <strong>合并</strong> - 添加新记录，保留现有数据
      </label>
    </div>
    <div class="filter-row">
      <label style="display: flex; align-items: center; gap: 0.5rem;">
        <input type="radio" name="importMode" value="skip_duplicates">
        <strong>跳过重复</strong> - 检测并跳过已存在的记录
      </label>
    </div>
    <!-- replace 模式风险大，暂不支持 -->
  </div>

  <!-- 开始导入 -->
  <div class="card text-center">
    <button class="btn btn-warning" id="startImport" style="padding: 1rem 2rem; font-size: 1rem;">
      开始导入
    </button>
    <p class="text-muted mt-2">导入操作可能会修改数据库，请谨慎操作</p>
  </div>

  <!-- 导入进度 -->
  <div id="importProgress" style="display: none;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/message_recorder/static/js/export.js"></script>
{% endblock %}

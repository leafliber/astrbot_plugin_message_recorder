{% extends "base.html" %}
{% block title %}搜索 - 消息记录器{% endblock %}
{% set active_page = 'search' %}

{% block content %}
<!-- 筛选条件 -->
<div class="filter-section">
  <div class="filter-row">
    <div class="filter-group search-group">
      <label class="filter-label">关键词:</label>
      <input type="text" class="filter-input search-input" id="keywordInput" placeholder="搜索消息内容...">
    </div>
  </div>

  <div class="filter-row">
    <div class="filter-group">
      <label class="filter-label">平台:</label>
      <select class="filter-select" id="platformFilter">
        <option value="">全部平台</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">消息类型:</label>
      <select class="filter-select" id="typeFilter">
        <option value="">全部</option>
        <option value="group">群聊</option>
        <option value="private">私聊</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">排序:</label>
      <select class="filter-select" id="orderFilter">
        <option value="desc">时间倒序</option>
        <option value="asc">时间正序</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">每页:</label>
      <select class="filter-select" id="limitFilter">
        <option value="50">50条</option>
        <option value="100">100条</option>
        <option value="200">200条</option>
      </select>
    </div>
  </div>

  <div class="filter-row" id="advancedFilters" style="display: none;">
    <div class="filter-group">
      <label class="filter-label">群组:</label>
      <select class="filter-select" id="groupFilter">
        <option value="">全部群组</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">发送者:</label>
      <select class="filter-select" id="senderFilter">
        <option value="">全部发送者</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label">开始时间:</label>
      <input type="datetime-local" class="filter-input" id="startTimeInput">
    </div>
    <div class="filter-group">
      <label class="filter-label">结束时间:</label>
      <input type="datetime-local" class="filter-input" id="endTimeInput">
    </div>
  </div>

  <div class="filter-row">
    <button class="btn btn-outline" onclick="toggleAdvancedFilters()">展开更多筛选</button>
    <button class="btn" onclick="loadMessages()">刷新</button>
    <button class="btn btn-success" onclick="exportCurrentResults()">导出当前结果</button>
  </div>
</div>

<!-- 消息列表 -->
<div class="card">
  <div class="card-header">消息列表</div>
  <div class="message-list" id="messageList">
    <p class="text-center text-muted">加载中...</p>
  </div>
</div>

<!-- 分页 -->
<div class="pagination" id="pagination"></div>
{% endblock %}

{% block extra_js %}
<script src="/message_recorder/static/js/search.js"></script>
<script>
  let advancedVisible = false;
  function toggleAdvancedFilters() {
    const el = document.getElementById('advancedFilters');
    const btn = event.target;
    advancedVisible = !advancedVisible;
    el.style.display = advancedVisible ? 'flex' : 'none';
    btn.textContent = advancedVisible ? '收起筛选' : '展开更多筛选';
  }
</script>
{% endblock %}
